<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          
          function getFetch() {
            return currentFetch;
          }
          function setFetch(val) {
            currentFetch = val;
          }

          try {
            Object.defineProperty(window, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            // If window.fetch cannot be redefined directly, try defining it on Window.prototype
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: getFetch,
                set: setFetch,
                configurable: true,
                enumerable: true
              });
            } catch (ep) {
              console.warn("Could not patch fetch on Window.prototype:", ep);
            }
          }
        } catch (globalErr) {
          console.error("Fetch interceptor init failed:", globalErr);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
